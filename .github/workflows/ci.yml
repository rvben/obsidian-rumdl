name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: node scripts/audit-dependencies.mjs

      - name: Lint
        run: npm run lint

      # Builds first: the startup tests run against the bundle that ships.
      - name: Build and test
        run: npm test

      - name: Start the plugin in Chromium
        run: npm run test:browser
