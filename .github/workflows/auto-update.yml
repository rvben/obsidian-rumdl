name: Auto-update on rumdl release

on:
  repository_dispatch:
    types: [rumdl_release]
  schedule:
    # Poll for new rumdl-wasm releases every 6 hours as a fallback
    # in case repository_dispatch fails (e.g. expired token)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'rumdl version to update to (without v prefix)'
        required: false
        type: string

permissions:
  contents: read

# Serialize runs so a scheduled run and a dispatch cannot prepare the same
# version twice. A queued run only starts after the active one finishes, so it
# sees the release the previous run published and exits as up to date.
concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare a release if one is missing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve target rumdl-wasm version
        id: rumdl
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            RUMDL_VERSION="$DISPATCH_VERSION"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            RUMDL_VERSION="$INPUT_VERSION"
          else
            RUMDL_VERSION=$(npm view rumdl-wasm version)
          fi
          if ! [[ "$RUMDL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: '${RUMDL_VERSION}' is not a valid rumdl-wasm version" >&2
            exit 1
          fi
          echo "version=${RUMDL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Target rumdl-wasm version: ${RUMDL_VERSION}"

      # Two independent reasons to act, and the second one is what makes a
      # failed release recoverable.
      #
      # The dependency in package.json is written to main before the release
      # that carries it can possibly succeed: the release has to be built from
      # a pushed commit, so the bump cannot be deferred until afterwards. If
      # "already up to date" were decided from package.json alone, a run that
      # committed the bump and then failed to release would leave that plugin
      # version tagged nowhere and published nowhere, and every later run would
      # read the updated package.json and skip it. Permanently, and silently.
      #
      # So the published GitHub Releases are consulted as well: whatever
      # version manifest.json currently names must exist as a release, and if
      # it does not, this run builds and publishes it instead of bumping again.
      # The cost of asking this way is that a hand-made version bump sitting on
      # main unreleased will be picked up and released here; that is loud and
      # revocable, unlike the silent skip it replaces.
      - name: Decide whether a release is needed
        id: plan
        env:
          TARGET_RUMDL: ${{ steps.rumdl.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CURRENT_RUMDL=$(jq -r '.dependencies["rumdl-wasm"] // empty' package.json | tr -d '^~')
          if ! [[ "$CURRENT_RUMDL" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: package.json rumdl-wasm dependency '${CURRENT_RUMDL}' is not a plain version" >&2
            exit 1
          fi

          PLUGIN_VERSION=$(jq -r '.version' manifest.json)
          if ! [[ "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: manifest.json version '${PLUGIN_VERSION}' is not a plain version" >&2
            exit 1
          fi

          # Only a 404 may be read as "not released". Any other status is an
          # answer we do not have, and must fail the run rather than be
          # mistaken for a missing release and cause a republish.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${PLUGIN_VERSION}")
          case "$CODE" in
            200) RELEASED=true ;;
            404) RELEASED=false ;;
            *)
              echo "Error: GitHub API returned HTTP ${CODE} for release ${PLUGIN_VERSION}" >&2
              exit 1
              ;;
          esac

          echo "Plugin ${PLUGIN_VERSION} released: ${RELEASED}"
          echo "rumdl-wasm current: ${CURRENT_RUMDL}, target: ${TARGET_RUMDL}"

          if [ "$CURRENT_RUMDL" != "$TARGET_RUMDL" ]; then
            echo "Updating rumdl-wasm to ${TARGET_RUMDL}"
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASED" != "true" ]; then
            echo "::notice::Plugin ${PLUGIN_VERSION} was prepared but never released, releasing it now"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already at rumdl-wasm ${TARGET_RUMDL} and ${PLUGIN_VERSION} is released, nothing to do"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update rumdl-wasm
        if: steps.plan.outputs.bump == 'true'
        env:
          TARGET_RUMDL: ${{ steps.rumdl.outputs.version }}
        run: |
          set -euo pipefail
          npm install "rumdl-wasm@${TARGET_RUMDL}"

      - name: Bump plugin version
        if: steps.plan.outputs.bump == 'true'
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(jq -r '.version' manifest.json)

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"

          jq --arg v "$NEW_VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          OBSIDIAN_MIN=$(jq -r '.minAppVersion' manifest.json)
          jq --arg v "$NEW_VERSION" --arg min "$OBSIDIAN_MIN" '.[$v] = $min' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

          echo "Bumped version to $NEW_VERSION"

      # The release workflow builds the tree it releases, so this build is not
      # the one that ships. It is here to keep a broken upstream release out of
      # main: the dependency bump is about to be committed, and committing one
      # that cannot build would leave main unbuildable for everyone.
      - name: Build
        if: steps.plan.outputs.bump == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Verify build
        if: steps.plan.outputs.bump == 'true'
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css versions.json; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file not found" >&2
              exit 1
            fi
            echo "Found: $file ($(wc -c < "$file") bytes)"
          done
          MAIN_SIZE=$(wc -c < main.js)
          if [ "$MAIN_SIZE" -lt 1000000 ]; then
            echo "Error: main.js is too small ($MAIN_SIZE bytes), WASM may not be embedded" >&2
            exit 1
          fi
          echo "WASM embedded in main.js (size: $MAIN_SIZE bytes)"

      - name: Commit
        if: steps.plan.outputs.bump == 'true'
        env:
          TARGET_RUMDL: ${{ steps.rumdl.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore: update rumdl-wasm to ${TARGET_RUMDL}"
          git push origin HEAD:main

      # Both paths converge here: manifest.json names the version to release and
      # HEAD is the commit that carries it, whether this run bumped it or found
      # an earlier run's bump unreleased.
      - name: Record what to release
        id: target
        if: steps.plan.outputs.release_needed == 'true'
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' manifest.json)
          SHA=$(git rev-parse HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} from ${SHA}"

  # The tag and the GitHub Release are created here, after the commit is on
  # main, and a failure leaves no record of success: the next run finds this
  # version still unreleased and tries again.
  release:
    name: Release
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
