# Obsidian requires release tags to be the bare version, with no leading "v".
[project]
tag_prefix = ""

[changelog]
curated = "replace"

[checks]
lint_command = "npm run lint && node scripts/audit-dependencies.mjs"
test_command = "npm test && npm run test:browser"

[hooks]
post-bump = "npm install --package-lock-only --ignore-scripts"

[[artifacts]]
command = '''npm_package_version=$(node -p "require('./package.json').version") node version-bump.mjs'''
files = ["manifest.json", "versions.json"]

[verify]
# This plugin is distributed as GitHub release assets, not an npm package.
skip = ["npm"]
